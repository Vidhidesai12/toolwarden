# Free on public GitHub repos.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install
        run: npm ci && npm --prefix web ci
      - name: Type-check (server, tests, dashboard)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: No known high-severity vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high && npm --prefix web audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker compose build
